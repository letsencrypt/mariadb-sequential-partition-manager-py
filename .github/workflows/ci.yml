name: Partition Manager CI

on: [push, pull_request]

permissions: {}

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python 3.9
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.9

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install --user pylint==3.1.0 pytest ruff validate-pyproject[all]

    - name: Install Partition Manager
      run: |
        pip install --editable ".[pymysql]"

    - name: Analysing the code with pylint
      run: |
        python -m pylint --errors-only partitionmanager

    - name: Lint Python code with Ruff
      run: |
        python -m ruff check --output-format=github

    - name: Checking format with Ruff
      run: |
        python -m ruff format --check .

    - name: Checking pyproject
      run: |
        validate-pyproject pyproject.toml

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Set up Python 3.9
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.9
    - name: Install Partition Manager
      run: |
        pip install --editable ".[pymysql]"
    - name: Install PyTest
      run: |
        pip install pytest
    - name: Run PyTest
      run: |
        pytest --junitxml=test-results/junit.xml
